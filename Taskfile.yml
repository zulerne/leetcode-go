version: '3'

tasks:
  default:
    desc: List all available tasks
    silent: true
    cmds:
      - task --list

  run-v:
    desc: "Run tests verbose  (task run-v -- 0001-two-sum)"
    vars:
      PKG: '{{.PKG | default .CLI_ARGS}}'
    preconditions:
      - sh: '[ -n "{{.PKG}}" ]'
        msg: "Usage: task run-v -- 0001-two-sum"
    cmds:
      - go test -v ./problems/{{.PKG}}

  bench:
    desc: "Run benchmarks  (task bench -- 0001-two-sum)"
    vars:
      PKG: '{{.PKG | default .CLI_ARGS}}'
    preconditions:
      - sh: '[ -n "{{.PKG}}" ]'
        msg: "Usage: task bench -- 0001-two-sum"
    cmds:
      - go test -bench=. -benchmem ./problems/{{.PKG}}

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  fmt:
    desc: Format all code
    cmds:
      - go fmt ./...

  new:
    desc: "Scaffold a new problem  (task new -- 42-trapping-rain-water)"
    vars:
      PKG: '{{.PKG | default .CLI_ARGS}}'
      PKG_PADDED:
        sh: |
          raw='{{.PKG | default .CLI_ARGS}}'
          num="${raw%%-*}"
          slug="${raw#*-}"
          printf "%04d-%s" "$num" "$slug"
      PKG_NAME:
        sh: echo '{{.PKG | default .CLI_ARGS}}' | sed 's/^[0-9]*-//' | tr -d '-'
      SLUG:
        sh: echo '{{.PKG | default .CLI_ARGS}}' | sed 's/^[0-9]*-//'
    preconditions:
      - sh: '[ -n "{{.PKG}}" ]'
        msg: "Usage: task new -- 42-trapping-rain-water"
    cmds:
      - mkdir -p problems/{{.PKG_PADDED}}
      - cmd: |
          if [ "{{.SQL}}" = "1" ]; then
            cp problems/template/solution.sql problems/{{.PKG_PADDED}}/solution.sql
            sed -i '' 's|{url}|https://leetcode.com/problems/{{.SLUG}}/description/|' problems/{{.PKG_PADDED}}/solution.sql
          else
            cp problems/template/solution.go problems/{{.PKG_PADDED}}/solution.go
            cp problems/template/solution_test.go problems/{{.PKG_PADDED}}/solution_test.go
            sed -i '' '/^\/\/go:build ignore$/{N;/\n$/d;}; s|package template|package {{.PKG_NAME}}|; s|{url}|https://leetcode.com/problems/{{.SLUG}}/description/|' problems/{{.PKG_PADDED}}/solution.go
            sed -i '' '/^\/\/go:build ignore$/{N;/\n$/d;}; s|package template|package {{.PKG_NAME}}|' problems/{{.PKG_PADDED}}/solution_test.go
          fi
      - "printf 'Created: problems/{{.PKG_PADDED}}/\\n'"

  new-sql:
    desc: "Scaffold a new SQL problem  (task new-sql -- 1757-recyclable-and-low-fat-products)"
    vars:
      PKG: '{{.PKG | default .CLI_ARGS}}'
      PKG_PADDED:
        sh: |
          raw='{{.PKG | default .CLI_ARGS}}'
          num="${raw%%-*}"
          slug="${raw#*-}"
          printf "%04d-%s" "$num" "$slug"
      SLUG:
        sh: echo '{{.PKG | default .CLI_ARGS}}' | sed 's/^[0-9]*-//'
    preconditions:
      - sh: '[ -n "{{.PKG}}" ]'
        msg: "Usage: task new-sql -- 1757-recyclable-and-low-fat-products"
    cmds:
      - mkdir -p problems/{{.PKG_PADDED}}
      - cp problems/template/solution.sql problems/{{.PKG_PADDED}}/solution.sql
      - sed -i '' 's|{url}|https://leetcode.com/problems/{{.SLUG}}/description/|' problems/{{.PKG_PADDED}}/solution.sql
      - "printf 'Created: problems/{{.PKG_PADDED}}/\\n'"
